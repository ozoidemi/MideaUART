# =============================================================================
# Midea A/C — Living Room (SLWF-01Pro v2 dongle, ESP8266)
# =============================================================================
# Production config. Adds read-only ionizer (Mshield) state reporting.
#
# How ionizer reporting works:
#   The upstream `midea` ESPHome component (and the dudanov/MideaUART library
#   underneath it) does not decode the ionizer bit from the AC's status
#   response frames. The bit IS sent by the AC — it's just at an offset the
#   library doesn't surface. We confirmed this by capturing UART traffic
#   while toggling the panel: bit 5 of byte 19 in the polled status response
#   tracks ionizer state cleanly across all observed transitions, and never
#   flips spuriously.
#
#   Rather than fork the midea component, we passively observe the same
#   bytes via the UART debug hook and expose the bit as a binary_sensor.
#   This is read-only and does not interfere with the midea component's
#   ownership of the bus.
#
# Known limitations:
#   - The ionizer is panel-only (SWING+FLASHCOOL chord, hold 3s). No remote
#     button, no app exposure, no Matter exposure. The display shows ON/OF
#     briefly when toggled. The user must walk to the AC to change it.
#     The AC Ionizer switch entity allows HA/UART control as well.
#   - This binary_sensor reflects the AC's actual state, so if the unit is
#     unplugged and the ionizer state resets, this entity will follow.
#
# FlashCool note:
#   FlashCool is NOT the same as the BOOST preset on this model. FlashCool
#   state arrives in 0xB5 unsolicited notifications (TLV 0x6700) and is
#   exposed as the fc_state binary_sensor. Write path is unknown — read-only.
#   IR replay via remote_transmitter is not implemented.
# =============================================================================

substitutions:
  name: "ac-living-room"
  friendly_name: "AC Living Room"
  sntp_update_interval: 6h
  wifi_fast_connect: "true"
  log_level: "DEBUG"

  visual_min_temperature: "16 °C"
  visual_max_temperature: "30 °C"
  visual_temperature_step: "1.0 °C"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: False
  project:
    name: SMLIGHT.SLWF-01Pro
    # Version history:
    #   2.6 — added read-only ionizer binary_sensor via UART debug hook
    #   2.7 — three small fixes:
    #         (a) initial-state bug: ionizer entity was stuck "unknown" until
    #             the first off→on transition because the parser only fired
    #             on changes; now publishes on the very first frame too.
    #         (b) removed web_server (HA API is the only control surface;
    #             no need for a second unauthenticated control plane).
    #         (c) added captive_portal so the wifi.ap fallback is actually
    #             usable for credential recovery if the device loses the
    #             home network.
    #   2.8 — switched from platformio_options lib_deps to external_components
    #         so ESPHome uses our fork's air_conditioner.h (with get_ionizer /
    #         set_ionizer). Added ionizer switch entity for write-path testing.
    #   2.9 — ECO+Ionizer Test (temp): programmatic 3-cycle / 24-check script.
    #         Verified 24/24. Removed in 2.11.
    #   2.11 — Remove ECO+ionizer test scaffolding (passed 24/24, no longer needed).
    #   2.12 — Add HEAT_COOL to supported_modes explicitly so Auto mode is always
    #          present in HA regardless of autoconf status.
    #   2.13 — Remap HEAT_COOL → AUTO in ac_adapter.cpp and climate.py so HA
    #          renders the mode as "Auto" instead of "Heat/Cool". Wire protocol
    #          unchanged; MideaMode::MODE_AUTO still sent over UART.
    #   2.14 — Swing: button → state-backed switch (reads climate swing_mode).
    #          Display: kept as button (no UART state readback, optimistic
    #          switch would drift). Added explicit power-off button entity.
    #   2.15 — Remove power-off button entity; off handled via hvac_modes
    #          feature in the HA card (inline with mode buttons).
    #   2.16 — Mode restriction test: covers all mode/fan/preset combinations
    #          and coexistence rules from the user manual. 14 PASS / 8 FAIL
    #          (6 spurious, 2 genuine: ECO+SLEEP silently rejected in AUTO).
    #   2.17 — Remove mode restriction test scaffolding. Findings in CLAUDE.md.
    #   2.18 — FlashCool UART discovery test: START/STOP buttons enable verbose
    #          frame logging; Mark-ON/Mark-OFF buttons label the transitions.
    #          Removed dead on_button_click script.
    #   2.19 — Extended FC frame logger to cover bytes[33-43] (full body).
    #          FC and swing confirmed independent: FC chord does not affect
    #          swing bits. Previous FC=swing-bits conclusion was wrong.
    #   2.20 — FlashCool binary_sensor: B5 frame parser added; TLV 67 00 01 XX
    #          confirms FC state (XX=01 ON, XX=00 OFF). FC test scaffolding
    #          removed (4 buttons, g_fc_test_active global, FRAME logger block).
    #   2.21 — FC SET bit discovery: setRawBit/setTestBit/set_test_bit added to
    #          library; 4-candidate sequential script (C1-C4) with 5s waits and
    #          baseline comparison. Remove after FC SET bit confirmed.
    version: "2.21"

external_components:
  - source:
      type: git
      url: https://github.com/ozoidemi/MideaUART.git
      ref: a2f8171043e2a5852bc4b64c7d1976bc1c944795
    components: [midea]

esp8266:
  board: esp12e

logger:
  baud_rate: 115200
  level: ${log_level}
  # Keep the raw uart_debug byte spam out of the normal log.
  # The ionizer parser still runs; it just doesn't print every frame.
  logs:
    uart_debug: WARN

api:
  encryption:
    key: !secret homeassistant_api_encryption_key_ac_living_room

ota:
  - platform: esphome
    password: !secret ota_update_password_ac_living_room

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  fast_connect: "${wifi_fast_connect}"
  power_save_mode: LIGHT
  min_auth_mode: WPA2
  ap:
    ssid: !secret wifi_ssid_fallback_11
    password: !secret wifi_password_fallback_ac_living_room

# Captive portal pairs with the wifi.ap fallback above. It only activates
# when the device fails to join the home network and brings up its own AP.
# Then it serves a single page that lets you re-enter wifi credentials —
# nothing else. It does NOT expose entity state or controls, and it is not
# reachable while the device is on the home network. This is the lightweight
# recovery counterpart to web_server, with a much smaller threat surface:
# an attacker would have to be in radio range of a device that's already
# disconnected from the network and broadcasting an SOS.
captive_portal:

time:
  - platform: sntp
    id: sntp_time
    update_interval: ${sntp_update_interval}
    servers:
      - !secret sntp_server
      - pool.ntp.org

# -----------------------------------------------------------------------------
# Globals: hold the latest decoded ionizer state so the binary_sensor template
# can read it. Single bit, single source of truth.
# -----------------------------------------------------------------------------
globals:
  - id: g_ionizer_bit
    type: bool
    initial_value: 'false'
    restore_value: no   # always re-read from the AC after boot
  - id: g_fc_bit
    type: bool
    initial_value: 'false'
    restore_value: no   # always re-read from the AC after boot
  - id: g_fc_baseline
    type: bool
    initial_value: 'false'
    restore_value: no   # scratch space for FC SET bit discovery script

# -----------------------------------------------------------------------------
# UART: same wiring as before. The midea component is the actual bus consumer;
# we use the debug.sequence hook only to passively observe response frames.
# -----------------------------------------------------------------------------
uart:
  id: uart_midea
  tx_pin: 12
  rx_pin: 14
  baud_rate: 9600
  debug:
    direction: RX
    dummy_receiver: false
    after:
      delimiter: "\n"     # never matches; rely on idle timeout for frame end
      timeout: 50ms
      bytes: 256
    sequence:
      - lambda: |-
          if (bytes.size() < 12 || bytes[0] != 0xAA) return;

          // B5 unsolicited notification: scan TLV records for FlashCool state.
          // Format: AA <len> AC 00 00 00 00 00 08 05 B5 <count> <TLV...> <ctr> <CRC16>
          // TLV 67 00 01 XX: XX=0x01 = FC ON, XX=0x00 = FC OFF.
          if (bytes[10] == 0xB5) {
            for (size_t i = 12; i + 3 < bytes.size() - 1; i++) {
              if (bytes[i] == 0x67 && bytes[i+1] == 0x00 && bytes[i+2] == 0x01) {
                bool fc = bytes[i+3] != 0x00;
                if (!id(fc_state).has_state() || fc != id(g_fc_bit)) {
                  id(g_fc_bit) = fc;
                  id(fc_state).publish_state(fc);
                }
                break;
              }
            }
            return;
          }

          // Polled status response only (0xAA 0x2C = 44 bytes).
          if (bytes.size() < 44 || bytes[1] != 0x2C) return;

          // Ionizer: bit 5 of byte 19 (m_data[9] mask 0x20).
          bool ion = (bytes[19] & 0x20) != 0;
          if (!id(ionizer_state).has_state() || ion != id(g_ionizer_bit)) {
            id(g_ionizer_bit) = ion;
            id(ionizer_state).publish_state(ion);
          }

remote_transmitter:
  id: ir_tx
  pin: GPIO13
  carrier_duty_percent: 100%

climate:
  - platform: midea
    name: ${friendly_name}
    id: midea_climate
    uart_id: uart_midea
    period: 1s
    timeout: 2s
    num_attempts: 3
    autoconf: true
    beeper: true
    visual:
      min_temperature: "${visual_min_temperature}"
      max_temperature: "${visual_max_temperature}"
      temperature_step: "${visual_temperature_step}"
    supported_modes:
      - AUTO
      - COOL
      - DRY
      - FAN_ONLY
    custom_fan_modes:
      - SILENT
      - TURBO
    supported_presets:
      - ECO
      - BOOST
      - SLEEP
    custom_presets:
      - FREEZE_PROTECTION
    supported_swing_modes:
      - VERTICAL
    outdoor_temperature:
      name: ${friendly_name} Outdoor Temperature
    power_usage:
      name: ${friendly_name} Power Usage
    humidity_setpoint:
      name: ${friendly_name} Indoor Humidity

binary_sensor:
  - platform: template
    name: ${friendly_name} Ionizer
    id: ionizer_state
    icon: mdi:air-purifier
    # No `lambda:` poll function — we publish_state directly from the UART
    # parser when the bit changes. This keeps HA's history clean: one event
    # per actual transition, not one per second.
  - platform: template
    name: ${friendly_name} FlashCool
    id: fc_state
    icon: mdi:lightning-bolt
    # Published directly from the B5 UART frame parser (TLV 0x6700).
    # Read-only — no write path identified in 0xC0 SET frame.

button:
  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset

  - platform: template
    name: ${friendly_name} Display Toggle
    id: midea_display_toggle
    icon: mdi:theme-light-dark
    on_press:
      - midea_ac.display_toggle:

  # --- FC SET bit discovery (remove after bit confirmed) ---------------------
  - platform: template
    name: "FC Set Test: RUN"
    id: fc_set_test_run
    icon: mdi:magnify
    on_press:
      - script.execute: fc_set_test

switch:
  - platform: template
    name: ${friendly_name} Beeper
    id: midea_beeper
    icon: mdi:volume-source
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - midea_ac.beeper_on:
    turn_off_action:
      - midea_ac.beeper_off:
  - platform: template
    name: "AC Ionizer"
    id: ac_ionizer
    optimistic: false
    turn_on_action:
      - lambda: id(midea_climate).set_ionizer(true);
    turn_off_action:
      - lambda: id(midea_climate).set_ionizer(false);
  - platform: template
    name: ${friendly_name} Swing
    id: midea_swing
    icon: mdi:tailwind
    lambda: |-
      return id(midea_climate).swing_mode == climate::CLIMATE_SWING_VERTICAL;
    turn_on_action:
      - lambda: |-
          auto call = id(midea_climate).make_call();
          call.set_swing_mode("vertical");
          call.perform();
    turn_off_action:
      - lambda: |-
          auto call = id(midea_climate).make_call();
          call.set_swing_mode("off");
          call.perform();

sensor:
  - platform: wifi_signal
    name: ${friendly_name} Wi-Fi Signal
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    id: uptime_sec
    internal: true
  - platform: template
    name: ${friendly_name} Uptime Days
    lambda: |-
      return (id(uptime_sec).state/60)/60/24;
    icon: mdi:clock-start
    unit_of_measurement: days
    update_interval: 60s

# --- FC SET bit discovery script (remove after bit confirmed) ----------------
# Tests 4 candidate SET frame bits sequentially. For each candidate:
#   1. Capture g_fc_baseline (current B5-reported FC state)
#   2. Send SET with candidate bit = 1
#   3. Wait 5s — if FC changes, g_fc_bit != g_fc_baseline → "<<< CHANGED"
#   4. Send SET with candidate bit = 0
#   5. Wait 5s
# Total runtime: ~40s. Trigger via "FC Set Test: RUN" button.
# Candidates (m_data byte, mask):
#   C1: [9]  0x40 — adjacent to ionizer bit in the features byte
#   C2: [8]  0x40 — adjacent byte, near turbo
#   C3: [6]  0x20 — entirely unknown byte between swing and turbo
#   C4: [10] 0x08 — adjacent to sleep/turbo/fahrenheit byte
script:
  - id: fc_set_test
    then:
      - lambda: |-
          ESP_LOGI("FC_TEST", "=== FC SET bit discovery: START ===");

      # C1: m_data[9] 0x40
      - lambda: |-
          id(g_fc_baseline) = id(g_fc_bit);
          ESP_LOGI("FC_TEST", "C1 ON:  m_data[9] 0x40  baseline=%d", (int)id(g_fc_baseline));
          id(midea_climate).set_test_bit(9, 0x40, true);
      - delay: 5s
      - lambda: |-
          bool changed = id(g_fc_bit) != id(g_fc_baseline);
          ESP_LOGI("FC_TEST", "C1 ON result:  FC=%d  %s",
                   (int)id(g_fc_bit), changed ? "<<< CHANGED" : "no change");
          id(midea_climate).set_test_bit(9, 0x40, false);
      - delay: 5s
      - lambda: |-
          ESP_LOGI("FC_TEST", "C1 OFF result: FC=%d", (int)id(g_fc_bit));

      # C2: m_data[8] 0x40
      - lambda: |-
          id(g_fc_baseline) = id(g_fc_bit);
          ESP_LOGI("FC_TEST", "C2 ON:  m_data[8] 0x40  baseline=%d", (int)id(g_fc_baseline));
          id(midea_climate).set_test_bit(8, 0x40, true);
      - delay: 5s
      - lambda: |-
          bool changed = id(g_fc_bit) != id(g_fc_baseline);
          ESP_LOGI("FC_TEST", "C2 ON result:  FC=%d  %s",
                   (int)id(g_fc_bit), changed ? "<<< CHANGED" : "no change");
          id(midea_climate).set_test_bit(8, 0x40, false);
      - delay: 5s
      - lambda: |-
          ESP_LOGI("FC_TEST", "C2 OFF result: FC=%d", (int)id(g_fc_bit));

      # C3: m_data[6] 0x20
      - lambda: |-
          id(g_fc_baseline) = id(g_fc_bit);
          ESP_LOGI("FC_TEST", "C3 ON:  m_data[6] 0x20  baseline=%d", (int)id(g_fc_baseline));
          id(midea_climate).set_test_bit(6, 0x20, true);
      - delay: 5s
      - lambda: |-
          bool changed = id(g_fc_bit) != id(g_fc_baseline);
          ESP_LOGI("FC_TEST", "C3 ON result:  FC=%d  %s",
                   (int)id(g_fc_bit), changed ? "<<< CHANGED" : "no change");
          id(midea_climate).set_test_bit(6, 0x20, false);
      - delay: 5s
      - lambda: |-
          ESP_LOGI("FC_TEST", "C3 OFF result: FC=%d", (int)id(g_fc_bit));

      # C4: m_data[10] 0x08
      - lambda: |-
          id(g_fc_baseline) = id(g_fc_bit);
          ESP_LOGI("FC_TEST", "C4 ON:  m_data[10] 0x08  baseline=%d", (int)id(g_fc_baseline));
          id(midea_climate).set_test_bit(10, 0x08, true);
      - delay: 5s
      - lambda: |-
          bool changed = id(g_fc_bit) != id(g_fc_baseline);
          ESP_LOGI("FC_TEST", "C4 ON result:  FC=%d  %s",
                   (int)id(g_fc_bit), changed ? "<<< CHANGED" : "no change");
          id(midea_climate).set_test_bit(10, 0x08, false);
      - delay: 5s
      - lambda: |-
          ESP_LOGI("FC_TEST", "C4 OFF result: FC=%d", (int)id(g_fc_bit));

      - lambda: |-
          ESP_LOGI("FC_TEST", "=== FC SET bit discovery: COMPLETE ===");

interval:
  - interval: 3s
    then:
      - lambda: id(ac_ionizer).publish_state(id(midea_climate).get_ionizer());


# No web_server block by design. The HA API (above) is the only control
# surface we expose. The ESPHome web_server is HTTP-only, unauthenticated,
# and provides functionality that HA already covers — leaving it enabled
# is unnecessary attack surface even on a segmented IoT VLAN.
